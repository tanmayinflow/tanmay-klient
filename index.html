<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>tanmay</title>
    <!-- Barva se dorovná podle uloženého režimu ještě před vykreslením (níž). -->
    <meta name="theme-color" content="#F4F0EB" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="tanmay" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=EB+Garamond:ital,wght@0,400;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { margin: 0; padding: 0; min-height: 100%; }
      /* Linen je výchozí pole domu · skript níž ho přepne na Forest Night,
         když si člověk naposledy zvolil noc. Bez toho blikne při každém
         startu opačný režim. */
      body { background: #F4F0EB; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        /* PŘED PRVNÍM VYKRESLENÍM. Bez tohohle blikne při každém startu
           Signature Linen a teprve pak naskočí uložený motiv. Mapa je jen
           POLE každé rodiny ve dne a v noci; zbytek palety přinese aplikace.
           Sdílené jádro je autorita — `theme-bootstrap.test.js` shodí build,
           jakmile se ta dvě čísla rozejdou. */
        var F = {
          "signature": ["#F4F0EB", "#0F100E"],
          "clay-alabaster": ["#F0E2D3", "#15110F"],
          "river-mist": ["#E5ECEA", "#101315"],
          "atlantic-sky": ["#E6F1F4", "#0E1216"],
          "olive-gold": ["#F3EAC4", "#10120F"],
          "mulberry-paper": ["#F1E8EA", "#130F11"],
          "teal-parchment": ["#F3E8BC", "#0E1312"]
        };
        try {
          var rodina = "signature", rezim = "light";
          try {
            var raw = localStorage.getItem("tm-appearance-v2");
            if (raw) {
              var p = JSON.parse(raw);
              if (p && F[p.family]) rodina = p.family;
              if (p && (p.mode === "dark" || p.mode === "light" || p.mode === "system")) rezim = p.mode;
            } else {
              var old = localStorage.getItem("tm-theme");
              if (old === "dark" || old === "light") rezim = old;
            }
          } catch (e) {}
          if (rezim === "system") {
            rezim = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var pole = F[rodina][rezim === "dark" ? 1 : 0];
          var h = document.documentElement;
          h.setAttribute("data-theme-family", rodina);
          h.setAttribute("data-color-mode", rezim);
          h.style.setProperty("color-scheme", rezim);
          document.body.style.background = pole;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", pole);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
