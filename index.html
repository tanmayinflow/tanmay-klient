<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>tanmay</title>
    <!-- Barva se dorovná podle uloženého režimu ještě před vykreslením (níž). -->
    <meta name="theme-color" content="#F4F0EB" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="tanmay" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=EB+Garamond:ital,wght@0,400;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { margin: 0; padding: 0; min-height: 100%; }
      /* Linen je výchozí pole domu · skript níž ho přepne na Forest Night,
         když si člověk naposledy zvolil noc. Bez toho blikne při každém
         startu opačný režim. */
      body { background: #F4F0EB; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        /* PŘED PRVNÍM VYKRESLENÍM. Bez tohohle blikne při každém startu
           Signature Day a teprve pak naskočí uložený vzhled. Mapa je jen POLE
           každého pevného vzhledu; zbytek palety přinese aplikace. Sdílené
           jádro je autorita — `theme-bootstrap.test.js` shodí build, jakmile
           se ta čísla rozejdou.

           Skript rozumí VŠEM TŘEM generacím uložené volby, protože jinak by
           v den nasazení bliklo napříč celou instalovanou základnou. */
        var F = {
          "signature-day": "#F4F0EB",
          "signature-night": "#262725",
          "river-night": "#101315",
          "teal-night": "#0E1312",
          "mulberry-paper": "#F1E8EA",
          "slate-clay": "#DBD6D1",
          "sand-earth": "#D3C7AD",
          "smoke-spice": "#282227"
        };
        /* noční vzhledy · seznam je týž jako polarita v rejstříku */
        var N = ["signature-night", "river-night", "teal-night", "smoke-spice"];
        /* rodina × režim (V1, V1.1) → vzhled (V2) · tabulka je táž jako
           FAMILY_MIGRATION v rejstříku */
        var M = {
          "signature": { "system": "auto", "light": "signature-day", "dark": "signature-night" },
          "river-mist": "river-night",
          "teal-parchment": "teal-night",
          "mulberry-paper": "mulberry-paper",
          "atlantic-sky": "slate-clay",
          "clay-alabaster": "sand-earth",
          "olive-gold": "sand-earth"
        };
        try {
          var vzhled = "auto";
          try {
            var raw = localStorage.getItem("tm-appearance-v3");
            var p = raw ? JSON.parse(raw) : null;
            if (p && (p.preset === "signature-auto" || F[p.preset])) {
              vzhled = p.preset === "signature-auto" ? "auto" : p.preset;
            } else {
              var raw2 = localStorage.getItem("tm-appearance-v2");
              var q = raw2 ? JSON.parse(raw2) : null;
              var m = q ? M[q.family] : null;
              if (typeof m === "string") vzhled = m;
              else if (m) vzhled = m[q.mode === "light" || q.mode === "dark" ? q.mode : "system"];
              else {
                var old = localStorage.getItem("tm-theme");
                if (old === "dark") vzhled = "signature-night";
                else if (old === "light") vzhled = "signature-day";
              }
            }
          } catch (e) {}
          if (vzhled === "auto") {
            vzhled = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "signature-night" : "signature-day";
          }
          var pole = F[vzhled] || F["signature-day"];
          var noc = N.indexOf(vzhled) >= 0;
          var h = document.documentElement;
          h.setAttribute("data-appearance", vzhled);
          h.setAttribute("data-color-mode", noc ? "dark" : "light");
          h.style.setProperty("color-scheme", noc ? "dark" : "light");
          document.body.style.background = pole;
          var m2 = document.querySelector('meta[name="theme-color"]');
          if (m2) m2.setAttribute("content", pole);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
