<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>tanmay</title>
    <!-- Barva se dorovná podle uloženého režimu ještě před vykreslením (níž). -->
    <meta name="theme-color" content="#F4F0EB" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="tanmay" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=EB+Garamond:ital,wght@0,400;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { margin: 0; padding: 0; min-height: 100%; }
      /* Linen je výchozí pole domu · skript níž ho přepne na Forest Night,
         když si člověk naposledy zvolil noc. Bez toho blikne při každém
         startu opačný režim. */
      body { background: #E5D8C4; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        // Eight themes, Landscape Day default. Preserve valid saved choices.
        var F = {"landscape-day": "#E5D8C4", "landscape-night": "#1C1C1A", "monument-clay": "#EBEBDD", "sand-burnt-earth": "#D3C7AD", "garnet-slate": "#F7DEC1", "nagtang-black": "#141311", "mineral-pigments": "#F1EADB", "signature-day": "#F4F0EB"};
        var TC = { "monument-clay": "#26303B" };
        var N = ["landscape-night", "nagtang-black"];
        var G = {"landscape-day": "landscape", "landscape-night": "landscape", "monument-clay": "landscape", "sand-burnt-earth": "landscape", "garnet-slate": "landscape", "nagtang-black": "landscape", "mineral-pigments": "landscape", "signature-day": "landscape"};
        var P = { "slate-clay": "landscape-day", "sand-earth": "sand-burnt-earth", "smoke-spice": "landscape-day", "river-night": "landscape-day", "mulberry-paper": "garnet-slate", "teal-night": "landscape-day" };
        var M = { "river-mist": "landscape-day", "teal-parchment": "landscape-day", "mulberry-paper": "garnet-slate", "atlantic-sky": "landscape-day", "clay-alabaster": "sand-burnt-earth", "olive-gold": "sand-burnt-earth" };
        function preset(value) {
          var id = typeof value === "string" ? value : value && value.preset;
          if (!id && value && value.family) id = value.family === "signature" ? (value.mode === "light" ? "signature-day" : "landscape-day") : M[value.family];
          id = P[id] || id;
          return Object.prototype.hasOwnProperty.call(F,id) ? id : "landscape-day";
        }
        var id = "landscape-day";
        try {
          var raw = localStorage.getItem("tm-appearance-v3") || localStorage.getItem("tm-appearance-v2");
          var value = raw ? JSON.parse(raw) : null;
          if (value && (typeof value === "string" || typeof value === "object")) id = preset(value);
          else id = localStorage.getItem("tm-theme") === "light" ? "signature-day" : "landscape-day";
        } catch (e) {
          try { id = localStorage.getItem("tm-theme") === "light" ? "signature-day" : "landscape-day"; } catch (e) {}
        }
        try {
          if (["127.0.0.1","localhost","[::1]"].indexOf(window.location.hostname) >= 0) {
            var preview = new URLSearchParams(window.location.search).get("previewAppearance");
            if (preview && Object.prototype.hasOwnProperty.call(F,preview)) id = preview;
          }
        } catch (e) {}
        var dark = N.indexOf(id) >= 0;
        var h = document.documentElement;
        h.setAttribute("data-appearance", id);
        h.setAttribute("data-color-mode", dark ? "dark" : "light");
        h.setAttribute("data-frame-grammar", G[id]);
        h.style.setProperty("color-scheme", dark ? "dark" : "light");
        document.body.style.background = F[id];
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", TC[id] || F[id]);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
